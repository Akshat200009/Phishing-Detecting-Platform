spring.application.name=phishing-detection

spring.datasource.url=jdbc:postgresql://localhost:5432/phishing_detection_db
spring.datasource.username=postgres
spring.datasource.password=tanay
server.port=8080

#spring data jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Required in every environment; use a long random value through the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET}

# Optional first-admin bootstrap. Values come only from environment variables and are used only if no active admin exists.
app.admin.name=${APP_ADMIN_NAME:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

#VirusTotal Integration

virustotal.api.key=${VIRUSTOTAL_API_KEY:}

virustotal.api.url=https://www.virustotal.com/api/v3

#Safe Browsing API integration

safe-browsing.api.key=${GOOGLE_SAFE_BROWSING_API_KEY:}

safe-browsing.api.url=https://safebrowsing.googleapis.com/v4
